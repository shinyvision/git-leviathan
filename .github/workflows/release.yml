name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: write

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-${{ matrix.arch }}

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libasound2-dev

      - name: Install cargo-deb and cargo-generate-rpm
        run: |
          cargo install cargo-deb --locked
          cargo install cargo-generate-rpm --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Build .deb
        run: cargo deb --no-build

      - name: Build .rpm
        run: cargo generate-rpm

      - name: Build portable tarball (extract to / for system-wide install)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="${{ inputs.tag }}"
            VERSION="${VERSION#v}"
          fi
          STAGE="git-leviathan-${VERSION}-linux-${{ matrix.arch }}"
          ROOT="${STAGE}/usr"
          install -Dm755 target/release/git_leviathan "${ROOT}/bin/git_leviathan"
          install -Dm644 packaging/git-leviathan.desktop "${ROOT}/share/applications/git-leviathan.desktop"
          for size in 16 32 48 64 128 256 512; do
            install -Dm644 "packaging/icons/hicolor/${size}x${size}/git-leviathan.png" \
              "${ROOT}/share/icons/hicolor/${size}x${size}/apps/git-leviathan.png"
          done
          mkdir -p dist
          tar -czf "dist/${STAGE}.tar.gz" -C "$STAGE" usr

      - name: Collect artifacts
        run: |
          cp target/debian/*.deb dist/
          cp target/generate-rpm/*.rpm dist/
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*

  macos:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Generate .icns from PNG
        run: |
          ICONSET=packaging/icons/git-leviathan.iconset
          SRC=packaging/icons/git-leviathan.png
          mkdir -p "$ICONSET"
          sips -z 16 16     "$SRC" --out "$ICONSET/icon_16x16.png"
          sips -z 32 32     "$SRC" --out "$ICONSET/icon_16x16@2x.png"
          sips -z 32 32     "$SRC" --out "$ICONSET/icon_32x32.png"
          sips -z 64 64     "$SRC" --out "$ICONSET/icon_32x32@2x.png"
          sips -z 128 128   "$SRC" --out "$ICONSET/icon_128x128.png"
          sips -z 256 256   "$SRC" --out "$ICONSET/icon_128x128@2x.png"
          sips -z 256 256   "$SRC" --out "$ICONSET/icon_256x256.png"
          sips -z 512 512   "$SRC" --out "$ICONSET/icon_256x256@2x.png"
          sips -z 512 512   "$SRC" --out "$ICONSET/icon_512x512.png"
          sips -z 1024 1024 "$SRC" --out "$ICONSET/icon_512x512@2x.png"
          iconutil -c icns "$ICONSET" -o packaging/icons/git-leviathan.icns

      - name: Install cargo-bundle
        run: cargo install cargo-bundle --locked

      - name: Build .app bundle
        run: cargo bundle --release

      - name: Package tarball
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="${{ inputs.tag }}"
            VERSION="${VERSION#v}"
          fi
          STAGE="git-leviathan-${VERSION}-aarch64-apple-darwin"
          mkdir -p "$STAGE"
          APP_BUNDLE="target/release/bundle/osx/Git Leviathan.app"
          if [ ! -d "$APP_BUNDLE" ]; then
            APP_BUNDLE="target/release/bundle/osx/git_leviathan.app"
          fi
          cp -R "$APP_BUNDLE" "$STAGE/Git Leviathan.app"
          cp README.md LICENSE "$STAGE/"
          tar -czf "dist/${STAGE}.tar.gz" "$STAGE"
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/*

  windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Package zip
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "${{ inputs.tag }}" }
          $version = $tag -replace '^v', ''
          $stage = "git-leviathan-$version-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Force -Path dist, $stage | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/git_leviathan.exe" "$stage/"
          Copy-Item README.md, LICENSE "$stage/"
          Compress-Archive -Path $stage -DestinationPath "dist/$stage.zip"
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name != '' && github.ref_name || inputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-assets/*
