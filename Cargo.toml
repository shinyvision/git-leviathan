[workspace]
members = ["git_leviathan_plugin_api", "xtask"]

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["Rachel Snijders"]
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
semver = { version = "1", features = ["serde"] }
schemars = "0.8"
mlua = { version = "0.10", features = ["luajit", "vendored", "serialize"] }
notify = { version = "7", features = ["macos_fsevent"] }

[package]
name = "git_leviathan"
version = "0.2.1"
edition = "2021"
description = "A fast, native, graph-first Git client built with Iced."
license = "MIT"
authors.workspace = true
rust-version.workspace = true
repository = "https://github.com/shinyvision/git-leviathan"
homepage = "https://github.com/shinyvision/git-leviathan"
readme = "README.md"
keywords = ["git", "gui", "iced", "vcs", "git-client"]
categories = ["development-tools", "gui"]
# Keep the published tarball to the sources the crate actually builds from.
# Docs, CI, screenshots and the icon sizes only used by the .deb/.rpm packaging
# are not needed by `cargo install`.
exclude = [
    "/.cargo",
    "/.claude",
    "/.codex",
    "/.github",
    "/docs",
    "/packaging/icons/hicolor",
    "/*_REFACTOR.md",
    "/PLUGIN_UI_V1_CONTRACT.md",
]

[[bin]]
name = "git_leviathan"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14", features = ["advanced", "canvas", "image", "lazy", "svg", "tokio", "selector"] }
image = { version = "0.25", default-features = false, features = ["gif"] }
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
tokio = { version = "1", features = ["time", "sync", "rt", "rt-multi-thread", "macros", "signal"] }
notify = { workspace = true }
rfd = "0.15"
rusqlite = { version = "0.32", features = ["bundled"] }
tree-sitter = { version = "0.26.8", features = ["wasm"] }
tree-sitter-language = "0.1.7"
dirs = "5"
tempfile = "3"
flate2 = "1"
tar = "0.4"
mlua = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
git_leviathan_plugin_api = { path = "git_leviathan_plugin_api", version = "0.1.0" }
semver = { workspace = true }
libloading = "0.8"
sha2 = "0.10"
portable-pty = "0.8"
vt100 = "0.15"
lru = { version = "0.16", default-features = false }
unicode-width = "0.2"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

[package.metadata.deb]
name = "git-leviathan"
maintainer = "Rachel Snijders"
copyright = "2026, Rachel Snijders"
extended-description = "Git client built with Iced."
depends = "$auto"
section = "devel"
priority = "optional"
assets = [
    ["target/release/git_leviathan", "usr/bin/", "755"],
    ["packaging/git-leviathan.desktop", "usr/share/applications/", "644"],
    ["packaging/icons/git-leviathan.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
]

[package.metadata.generate-rpm]
name = "git-leviathan"
summary = "Git client built with Iced."

[[package.metadata.generate-rpm.assets]]
source = "target/release/git_leviathan"
dest = "/usr/bin/git_leviathan"
mode = "755"

[[package.metadata.generate-rpm.assets]]
source = "packaging/git-leviathan.desktop"
dest = "/usr/share/applications/git-leviathan.desktop"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "packaging/icons/hicolor/16x16/git-leviathan.png"
dest = "/usr/share/icons/hicolor/16x16/apps/git-leviathan.png"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "packaging/icons/hicolor/32x32/git-leviathan.png"
dest = "/usr/share/icons/hicolor/32x32/apps/git-leviathan.png"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "packaging/icons/hicolor/48x48/git-leviathan.png"
dest = "/usr/share/icons/hicolor/48x48/apps/git-leviathan.png"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "packaging/icons/hicolor/64x64/git-leviathan.png"
dest = "/usr/share/icons/hicolor/64x64/apps/git-leviathan.png"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "packaging/icons/hicolor/128x128/git-leviathan.png"
dest = "/usr/share/icons/hicolor/128x128/apps/git-leviathan.png"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "packaging/icons/hicolor/256x256/git-leviathan.png"
dest = "/usr/share/icons/hicolor/256x256/apps/git-leviathan.png"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "packaging/icons/hicolor/512x512/git-leviathan.png"
dest = "/usr/share/icons/hicolor/512x512/apps/git-leviathan.png"
mode = "644"

[package.metadata.bundle]
name = "Git Leviathan"
identifier = "com.github.shinyvision.git-leviathan"
icon = ["packaging/icons/git-leviathan.icns"]
