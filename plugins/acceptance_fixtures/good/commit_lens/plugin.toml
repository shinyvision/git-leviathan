id = "commit_lens"
name = "Commit Lens"
version = "0.1.0"
api_version = "1.0"
description = "acceptance fixture exercising graph/detail decorations, commands, keymaps, async, persistence, timers, watchers, settings, and health."
capabilities = ["ui:decoration:graph", "ui:region:repository", "async:spawn", "timer:create", "fs:watch:plugin"]
consumes_services = ["issue_tracker@1"]
requires_plugins = ["issue_tracker"]

[dependencies]
issue_tracker = ">=0.1.0"

[runtime]
strict_globals = false
